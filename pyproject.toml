[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mynet"
version = "0.2.1"
description = "Creating my own neural network implementation with JAX-based gradients"
authors = [
  { name = "Danilo de Souza"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy >=1.23",
  "pandas >=1.5",
  "jax >=0.4.0",
  "jaxlib >=0.4.0",
  "matplotlib >=3.5",
  "pytest >=7.0",
  "mypy >=1.0",
  "sphinx_rtd_theme",
  "sphinx>=7.0.0"
]

[project.optional-dependencies]
dev = [
  "black >=22.0",
  "isort >=5.0",
  "flake8 >=6.0",
  "pytest-cov >=4.0",
  "pre-commit >=3.0"
]
test = [
  "pytest >=7.0",
  "pytest-cov >=4.0",
  "hypothesis >=6.0"
]
viz = [
  "matplotlib >=3.5",
  "seaborn >=0.12",
  "plotly >=5.0"
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "test",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["neural_network"]

[tool.coverage.run]
source = ["neural_network"]
omit = [
    "*/tests/*",
    "*/test/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]